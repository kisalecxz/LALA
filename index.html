<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Will You Be My Valentine?</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      height: 100vh;
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #ff9a9e, #fad0c4);
      overflow: hidden;
      color: #fff;
    }

    .heart {
      position: absolute;
      width: 20px;
      height: 20px;
      background: red;
      transform: rotate(45deg);
      animation: float 8s linear infinite;
      opacity: 0.7;
    }

    .heart::before,
    .heart::after {
      content: "";
      position: absolute;
      width: 20px;
      height: 20px;
      background: red;
      border-radius: 50%;
    }

    .heart::before { left: -10px; }
    .heart::after { top: -10px; }

    @keyframes float {
      0% { transform: translateY(100vh) rotate(45deg); }
      100% { transform: translateY(-10vh) rotate(45deg); }
    }

    .page {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 0 16px;
      transition: opacity 0.6s ease, transform 0.6s ease;
    }

    .hidden {
      opacity: 0;
      pointer-events: none;
      transform: scale(0.95);
    }

    #page1 { background: #ffffff; color: #333; }

    #word {
      font-size: 3rem;
      min-height: 3.5rem;
      margin-top: 140px;
      font-weight: 700;
      color: #ff2f5b;
      text-shadow: 2px 2px 6px rgba(0,0,0,0.3), 0 0 10px #fff;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }

    .buttons { margin-top: 30px; display: none; }

    button {
      font-size: 1.1rem;
      padding: 12px 30px;
      border: none;
      border-radius: 30px;
      cursor: pointer;
      margin: 8px;
      transition: all 0.3s ease;
    }

    .primary { background: #ff4d6d; color: #fff; }
    .primary:hover { transform: scale(1.1); }

    .yes {
      background: #ff4d6d;
      color: #fff;
      transition: transform 0.4s ease, left 0.4s ease, top 0.4s ease;
      position: relative;
      z-index: 10;
    }
    .no {
      background: #fff;
      color: #ff4d6d;
      position: relative;
      transition: top 0.4s ease, transform 0.4s ease;
      z-index: 5;
    }

    .message { margin-top: 20px; font-size: 1.5rem; display: none; }

    .gif-container { position: absolute; top: 20px; width: 100%; text-align: center; }
    .gif-container img { max-width: 220px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.2); }

    @media (max-width: 480px) {
      .intro-text { font-size: 1.7rem; }
      #word { font-size: 2.2rem; margin-top: 120px; }
      .gif-container img { max-width: 160px; }
    }
  </style>
</head>
<body>

  <div class="page" id="page1">
    <div class="intro-text">I have something important to ask you… 💕</div>
    <button class="primary" onclick="goToValentine()">Tap to continue 💌</button>
  </div>

  <div class="page hidden" id="page2">
    <div class="gif-container hidden" id="finalGif">
      <img src="YOUR_GIF_HERE.gif" alt="Valentine GIF">
    </div>

    <div id="word"></div>

    <div class="buttons" id="buttons">
      <button class="yes" onclick="sayYes()">Yes 💘</button>
      <button class="no" onclick="moveNo()">No 🙈</button>
    </div>

    <div class="message" id="message">Yay! You just made my heart so happy 💕</div>
  </div>

  <script>
    for (let i = 0; i < 15; i++) {
      const heart = document.createElement('div');
      heart.className = 'heart';
      heart.style.left = Math.random() * 100 + 'vw';
      heart.style.animationDuration = 5 + Math.random() * 5 + 's';
      heart.style.display = 'none';
      document.body.appendChild(heart);
    }

    function goToValentine() {
      document.getElementById('page1').classList.add('hidden');
      document.getElementById('page2').classList.remove('hidden');
      document.querySelectorAll('.heart').forEach(h => h.style.display = 'block');
      setTimeout(showWords, 3000);
    }

    const words = ["Will", "you", "be", "my", "Valentine?"]; 
    const wordEl = document.getElementById('word');
    const buttons = document.getElementById('buttons');
    let index = 0;

    function showWords() {
      if (index < words.length) {
        wordEl.textContent = words[index];
        index++;
        setTimeout(showWords, 900);
      } else {
        buttons.style.display = 'block';
        document.getElementById('finalGif').classList.remove('hidden');
      }
    }

    function sayYes() {
      document.getElementById('message').style.display = 'block';
    }

    let noClicks = 0;

    function moveNo() {
      const noBtn = document.querySelector('.no');
      const yesBtn = document.querySelector('.yes');
      if(noClicks >= 3) return; // maximum 3 clicks
      noClicks++;

      // Last click logic: YES centered and large, overlaps Valentine text
      if (noClicks === 3) {
        yesBtn.style.transform = 'scale(4) translate(-50%, -50%)';
        yesBtn.style.position = 'absolute';
        yesBtn.style.left = '50%';
        yesBtn.style.top = '50%';
        yesBtn.style.zIndex = '30';

        // NO snatched away
        noBtn.textContent = '✋';
        noBtn.style.fontSize = '2rem';
        setTimeout(() => {
          noBtn.style.transform = 'translate(-50%, 200%) scale(0)';
        }, 300);
        return;
      }

      // YES grows and moves gradually
      const scale = 1 + noClicks * 0.15;
      yesBtn.style.transform = `scale(${scale}) translate(-50%, -50%)`;
      yesBtn.style.position = 'absolute';
      yesBtn.style.left = '50%';
      yesBtn.style.top = '60%';

      // NO moves downward each click
      noBtn.style.position = 'absolute';
      noBtn.style.left = '50%';
      noBtn.style.transform = 'translateX(-50%)';
      noBtn.style.top = `${70 + noClicks * 6}%`;
    }
  </script>

</body>
</html>
